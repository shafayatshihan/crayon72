<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayon 72 — build progress</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2622;--mut:#8a8178;--line:#e8e1d6;--ok:#3f9d6b;--run:#d98b2b;--wait:#b9b1a6;--bad:#c4553f;--ship:#4f7fd1;--ver:#7a5fc4;
--okbg:#e4f3ea;--runbg:#fbeedb;--waitbg:#eeeae3;--badbg:#f8e1db;--shipbg:#e0eafa;--verbg:#ebe5f8}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#efe9e0;--mut:#9a9186;--line:#34302b;--ok:#62c28f;--run:#f0a94a;--wait:#6d655c;--bad:#e67c66;--ship:#7aa3ee;--ver:#a58ae8;
--okbg:#1d3328;--runbg:#3a2c16;--waitbg:#2a2723;--badbg:#3e211b;--shipbg:#1b2a46;--verbg:#2c2447}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:28px;letter-spacing:-.02em}
.tile span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:12px;border-radius:99px;background:var(--waitbg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0 18px}
.legend em{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--mut)}
.card.open{grid-column:1/-1}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.key{font:600 12px ui-monospace,Consolas,monospace;color:var(--mut)}
.title{font-weight:600;font-size:15px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.s-waiting{background:var(--waitbg);color:var(--mut)}.s-building,.s-verifying{background:var(--runbg);color:var(--run)}
.s-built{background:var(--verbg);color:var(--ver)}.s-verified{background:var(--okbg);color:var(--ok)}
.s-shipped{background:var(--shipbg);color:var(--ship)}.s-paused{background:var(--badbg);color:var(--bad)}
.steps{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
.step{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.step.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.step.running{background:var(--runbg);color:var(--run);border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
.step.failed{background:var(--badbg);color:var(--bad);border-color:transparent}
@keyframes pulse{50%{opacity:.45}}
.cov{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.cov .bar{flex:1;height:8px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.stats b{color:var(--ink)}
.detail{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:none;cursor:auto}
.card.open .detail{display:block}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.q{font:12px ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:6px;background:var(--waitbg);color:var(--mut)}
.q.on{background:var(--okbg);color:var(--ok)}
h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
ul{margin:4px 0 0;padding-left:18px}li{margin:2px 0;font-size:13px}
.pg{font:12px ui-monospace,Consolas,monospace}
.flag{color:var(--run)}.bad{color:var(--bad)}.good{color:var(--ok)}
footer{margin-top:26px;color:var(--mut);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--run);margin-right:6px;animation:pulse 1.2s infinite}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div><h1>Crayon 72 — build progress</h1>
      <div class="sub" id="upd"></div></div>
    <div><button class="chip" id="auto" aria-pressed="true">Auto-refresh: on</button></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="bar" id="bigbar"></div>
  <div class="legend" id="legend"></div>
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"></div>
  <footer>Live from the workflow journal and the lecture files on disk — this page is rewritten every 15 s while the dashboard loop runs. Click a card for questions, pages, flags and review results.</footer>
</div>
<script>
const D = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const S = {open:new Set(), filter:'all', teacher:'all', q:'', auto:true};
try{const raw=sessionStorage.getItem('c72');if(raw){const o=JSON.parse(raw);Object.assign(S,o,{open:new Set(o.open||[])});}}catch(e){}
const save=()=>{try{sessionStorage.setItem('c72',JSON.stringify({...S,open:[...S.open]}))}catch(e){}};
const ST = {shipped:['Shipped','--ship'],verified:['Verified','--ok'],built:['Built','--ver'],building:['Building','--run'],verifying:['Reviewing','--run'],waiting:['Waiting','--wait'],paused:['Paused','--bad']};
const lecs = D ? D.lectures : [];
const doneSet = new Set(['shipped','verified']);
function qCount(L){ const uniq=L.uniq.length; const p = L.placed.length; return [p,uniq]; }
const esc = (s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  if(!D){document.body.innerHTML='<p style="padding:30px">No data yet — run <code>python scripts/progress.py</code>.</p>';return;}
  const running = lecs.flatMap(l=>l.steps).filter(s=>s.state==='running').length;
  const finished = lecs.filter(l=>doneSet.has(l.status)).length;
  const allQ = new Set(); let placedQ=0;
  lecs.forEach(l=>{const [p]=qCount(l); placedQ+=p; l.uniq.forEach(q=>allQ.add(q));});
  const totalQ = D.totalQuestions;
  $('#tiles').innerHTML = [
    [`${finished}<small style="font-size:15px;color:var(--mut)"> / ${lecs.length}</small>`,'Lectures finished'],
    [`${Math.min(placedQ,totalQ)}<small style="font-size:15px;color:var(--mut)"> / ${totalQ}</small>`,'Question parts placed'],
    [`<span class="dot" style="display:${running?'inline-block':'none'}"></span>${running}`,'Agents working now'],
    [lecs.filter(l=>l.status==='paused').length,'Paused / need attention'],
  ].map(([b,s])=>`<div class="tile"><b>${b}</b><span>${s}</span></div>`).join('');
  const seg = {shipped:0,verified:0,built:0,building:0,verifying:0,paused:0,waiting:0};
  lecs.forEach(l=>seg[l.status]++);
  $('#bigbar').innerHTML = Object.entries(seg).filter(([k,v])=>v).map(([k,v])=>`<i style="width:${v/lecs.length*100}%;background:var(${ST[k][1]})" title="${ST[k][0]}: ${v}"></i>`).join('');
  $('#legend').innerHTML = Object.entries(ST).map(([k,[n,c]])=>`<span><em style="background:var(${c})"></em>${n} ${seg[k]||0}</span>`).join('');
  const teachers=['all',...new Set(lecs.map(l=>l.teacher))];
  const filters=[['all','All'],['active','Running'],['waiting','Waiting'],['finished','Done'],['paused','Paused']];
  $('#tools').innerHTML = filters.map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filter===k}">${n}</button>`).join('')
    + '<span style="width:10px"></span>' + teachers.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${S.teacher===t}">${t==='all'?'All teachers':esc(t)}</button>`).join('')
    + `<input type="search" id="q" placeholder="Search lecture or question…" value="${esc(S.q)}">`;
  const match = (l)=>{
    if(S.teacher!=='all' && l.teacher!==S.teacher) return false;
    if(S.filter==='active' && !['building','verifying'].includes(l.status)) return false;
    if(S.filter==='waiting' && l.status!=='waiting') return false;
    if(S.filter==='finished' && !doneSet.has(l.status)) return false;
    if(S.filter==='paused' && l.status!=='paused') return false;
    if(S.q){const t=(l.key+' '+l.title+' '+l.teacher+' '+l.uniq.join(' ')).toLowerCase(); if(!t.includes(S.q.toLowerCase())) return false;}
    return true;
  };
  $('#grid').innerHTML = lecs.filter(match).map(card).join('') || '<p style="color:var(--mut)">Nothing matches.</p>';
  bind();
}
function card(l){
  const [p,t]=qCount(l); const open=S.open.has(l.key); const pct=t?Math.round(p/t*100):100;
  const st=ST[l.status]; const s=l.stats;
  const steps=l.steps.filter(x=>l.status!=='shipped'||x.state!=='waiting').map(x=>{
    const idle = x.idle!=null ? ` · ${x.idle<90?Math.round(x.idle)+'s':Math.round(x.idle/60)+'m'} idle` : '';
    return `<span class="step ${x.state}">${x.name}${x.state==='running'?' …'+idle:x.state==='done'?' ✓':x.state==='failed'?' ✗':''}</span>`;}).join('');
  const covBar = t?`<div class="cov"><div class="bar"><i style="width:${pct}%;background:var(--ok)"></i></div><span>${p}/${t} questions</span></div>`:'<div class="cov"><span>Example pages only (no past questions)</span></div>';
  const stats = `<div class="stats"><span><b>${s.pages}</b> pages</span><span><b>${s.variants}</b> variants</span><span><b>${s.figures}</b> figures</span><span><b>${s.anims}</b> animations${s.scene3d?` (<b>${s.scene3d}</b> 3D)`:''}</span><span><b>${s.videos}</b> videos</span></div>`;
  let det='';
  if(open){
    const done=new Set(l.placed);
    det = `<div class="detail" onclick="event.stopPropagation()">
      <h4>Questions (${t})</h4><div class="qs">${l.uniq.map(q=>`<span class="q ${done.has(q)?'on':''}">${q}</span>`).join('')||'<span style="color:var(--mut)">none assigned</span>'}</div>
      ${s.pageIds.length?`<h4>Pages</h4><div class="pg">${s.pageIds.join(' · ')}</div>`:''}
      ${l.steps.filter(x=>x.result).map(x=>stepDetail(x)).join('')}
    </div>`;
  }
  return `<div class="card ${open?'open':''}" data-k="${l.key}"><div class="top"><div><span class="key">${l.key.toUpperCase()} · ${esc(l.teacher)}</span><div class="title">${esc(l.title)}</div></div><span class="pill s-${l.status}">${st[0]}</span></div>
    <div class="steps">${steps}</div>${covBar}${stats}${det}</div>`;
}
function stepDetail(x){
  const r=x.result; if(!r) return '';
  const li=(a,c='')=>(a&&a.length)?`<ul>${a.map(i=>`<li class="${c}">${esc(i)}</li>`).join('')}</ul>`:'';
  if(x.name.startsWith('verify')) return `<h4>${x.name}</h4><div>Issues found <b>${r.issuesFound}</b> · tsc ${r.tscClean?'<span class="good">clean</span>':'<span class="bad">errors</span>'}</div>${r.fixed&&r.fixed.length?'<div class="sub">Fixed</div>'+li(r.fixed,'good'):''}${r.unresolved&&r.unresolved.length?'<div class="sub">Unresolved</div>'+li(r.unresolved,'bad'):''}${r.numericsChecked&&r.numericsChecked.length?'<div class="sub">Numericals re-derived</div>'+li(r.numericsChecked):''}`;
  return `<h4>${x.name} — ${r.status}</h4>${r.missing&&r.missing.length?'<div class="sub bad">Missing</div>'+li(r.missing,'bad'):''}${r.flags&&r.flags.length?'<div class="sub">Flags to re-check by hand</div>'+li(r.flags,'flag'):''}`;
}
function bind(){
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const k=c.dataset.k;S.open.has(k)?S.open.delete(k):S.open.add(k);save();render();});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();render();});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.teacher=b.dataset.t;save();render();});
  const q=$('#q'); if(q) q.oninput=()=>{S.q=q.value;save();render();const n=$('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length);};
}
$('#auto').onclick=()=>{S.auto=!S.auto;save();$('#auto').textContent='Auto-refresh: '+(S.auto?'on':'off');$('#auto').setAttribute('aria-pressed',S.auto);};
$('#auto').textContent='Auto-refresh: '+(S.auto?'on':'off');$('#auto').setAttribute('aria-pressed',S.auto);
render();
const tick=()=>{ if(D) $('#upd').textContent='Updated '+Math.max(0,Math.round(Date.now()/1000-D.generated))+' s ago · '+new Date(D.generated*1000).toLocaleTimeString(); };
tick(); setInterval(tick,1000);
setInterval(()=>{ if(S.auto && !(document.activeElement && document.activeElement.id==='q')) location.reload(); }, 15000);
</script>
</body>
</html>
